<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BookSwap{% endblock %}</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <style>
    :root{--bg:#fafaf9;--surface:#fff;--line:#e5e5e0;--text:#1c1c1a;--muted:#6b6b66;--accent:#1f6f5c;--on-accent:#fff;--tint:#eef5f2}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121413;--surface:#1b1e1c;--line:#2b2f2c;--text:#ecece8;--muted:#9a9d97;--accent:#4fb89c;--on-accent:#0d1512;--tint:#17221e}}
    :root[data-theme="dark"]{--bg:#121413;--surface:#1b1e1c;--line:#2b2f2c;--text:#ecece8;--muted:#9a9d97;--accent:#4fb89c;--on-accent:#0d1512;--tint:#17221e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
    a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    h2,h3{margin:.4rem 0 .8rem;font-weight:600;letter-spacing:-.01em}
    .wrap{max-width:900px;margin:auto;padding:0 1rem 3rem}
    nav{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:center;padding:.9rem 0;margin-bottom:1rem;border-bottom:1px solid var(--line)}
    nav .brand{font-weight:700;color:var(--text);margin-right:auto}
    nav form{display:inline;margin:0}
    .card,main>form{background:var(--surface);border:1px solid var(--line);border-radius:12px}
    .card{padding:1rem;margin:.7rem 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
    .grid .card{margin:0}
    .grid .card:first-child{grid-column:span 2;background:var(--tint)}
    .grid>p{grid-column:1/-1}
    @media (max-width:560px){.grid .card:first-child{grid-column:auto}}
    main>form{padding:1rem;margin:.8rem 0}
    main>form[method="get"]{display:flex;flex-wrap:wrap;gap:.5rem}
    main>form p{margin:.7rem 0}
    label{display:block;margin-bottom:.25rem;color:var(--muted);font-size:.9rem}
    input,select,textarea{width:100%;padding:.55rem .7rem;color:var(--text);font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;outline:none}
    main>form[method="get"] input,main>form[method="get"] select{width:auto;flex:1 1 140px;min-width:0}
    input[type=checkbox]{width:auto}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
    button{cursor:pointer;padding:.5rem 1rem;font:inherit;font-weight:600;color:var(--on-accent);background:var(--accent);border:0;border-radius:8px}
    button:hover{filter:brightness(1.1)}
    nav button,#theme{padding:.3rem .7rem;background:transparent;color:var(--text);border:1px solid var(--line)}
    small{color:var(--muted)}
    .errorlist{list-style:none;padding:0;margin:.3rem 0;color:#d64545}
  </style>
</head>
<body>
<div class="wrap">
<nav>
  <a class="brand" href="{% url 'listing_list' %}">📚 BookSwap</a>
  <a href="{% url 'listing_list' %}">Browse</a>
  {% if user.is_authenticated %}
    <a href="{% url 'listing_create' %}">+ List item</a>
    <a href="{% url 'my_requests' %}">Requests</a>
    <a href="{% url 'profile' user.username %}">{{ user.username }}</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Logout</button></form>
  {% else %}
    <a href="{% url 'login' %}">Login</a> <a href="{% url 'signup' %}">Sign up</a>
  {% endif %}
  <button id="theme" type="button" aria-label="Toggle dark mode">◐</button>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</div>
<script>
document.getElementById("theme").onclick=function(){
  var d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",d.dataset.theme)}catch(e){}};
</script>
</body>
</html>
